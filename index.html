<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personajes de Rick and Morty</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="container py-4">
    <h1 class="h4 text-center mb-4">Personajes de Rick and Morty</h1>

    <div id="mensaje"></div>
    <div id="galeria" class="row g-3"></div>

    <nav class="d-flex justify-content-center align-items-center gap-3 my-4">
      <button id="anterior" class="btn btn-secondary btn-sm">&laquo; Anterior</button>
      <span id="paginaTexto">Página 1 de 42</span>
      <button id="siguiente" class="btn btn-primary btn-sm">Siguiente &raquo;</button>
    </nav>
  </main>

  <!-- Ventana Detalle -->
  <div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="modalTitulo"></h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-5"><img id="modalImg" class="img-fluid rounded" alt=""></div>
            <div class="col-md-7"><dl id="modalDatos" class="mb-0"></dl></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
